<!DOCTYPE html>
<html>
<head>
    <title>Delete Patient</title>
</head>

<body>

<h2>Delete Patient</h2>

<p>
    Are you sure you want to delete
    <strong>{{ patient.name }}</strong>?
</p>

<form method="POST">
    {% csrf_token %}

    <button type="submit">Yes, Delete</button>

    <a href="{% url 'patient_list' %}">Cancel</a>
</form>

</body>
</html>
